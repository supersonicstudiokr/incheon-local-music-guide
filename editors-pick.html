<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Editor’s Picks</title>

  <style>
    :root{
      --max: 980px;
      --text: #111;
      --muted: rgba(0,0,0,.62);
      --line: rgba(0,0,0,.12);
      --soft: rgba(0,0,0,.045);
      --radius: 16px;

      /* ✅ 포인트 컬러(옅은 핑크) */
      --pink-bg: #ffe9ee;   /* 더 연하게: #fff1f4 */
      --pink-border: rgba(0,0,0,.10);
    }

    body{
      margin:0;
      color:var(--text);
      background:#fff;
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.75;
      word-break: keep-all;
    }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 40px 20px 90px;
    }

    /* top */
    .back-link{
      display:inline-block;
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      margin: 0 0 18px;
    }
    .back-link:hover{ text-decoration: underline; }

    /* ✅ 타이틀/설명 강조 박스 */
    .intro-box{
      padding: 18px 18px 16px;
      border-radius: var(--radius);
      background: var(--pink-bg);
      border: 1px solid var(--pink-border);
      margin: 0 0 18px;
    }
    h1{
      font-size: 44px;
      line-height: 1.12;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      font-weight: 900;
    }
    .subtitle{
      margin: 0;
      font-size: 18px;          /* ✅ 더 크게 */
      color: rgba(0,0,0,.80);   /* ✅ 더 진하게 */
      line-height: 1.7;
    }
    .subtitle strong{
      font-weight: 900;
    }

    /* ✅ hero banner (이제 여기로 내려옴) */
    .hero{
      margin: 0 0 18px;
    }
    .hero img{
      width:100%;
      height:auto;
      display:block;
      border-radius: var(--radius);
      border: 1px solid var(--line);
    }

    hr{
      border: 0;
      border-top: 1px solid var(--line);
      margin: 18px 0 14px;
    }

    /* actions */
    .actions{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 14px;
      align-items: center;
    }
    .btn{
      display:inline-block;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }
    .btn:hover{ background: rgba(0,0,0,.04); }

    /* zone nav (one line) */
    .zone-nav{
      position: sticky;
      top: 0;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,.06);
      padding: 10px 0;
      margin: 10px 0 18px;
      z-index: 10;
    }
    .zone-row{
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items:center;
    }
    .zone-chip{
      display:inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(0,0,0,.03);
      color: #111;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
    }
    .zone-chip:hover{ background: rgba(0,0,0,.06); }

    /* sections */
    .zone-section{ margin: 26px 0 34px; }
    .zone-title{
      font-size: 18px;
      font-weight: 900;
      margin: 0 0 12px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .zone-title span{
      font-size: 12px;
      color: rgba(0,0,0,.55);
      border: 1px solid rgba(0,0,0,.10);
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,.03);
      font-weight: 700;
    }

    /* spot list as text buttons */
    .spot-list{
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .spot-item{
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fff;
    }
    .spot-btn{
      display:inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #111;
      font-weight: 900;
      border-radius: 999px;
      padding: 8px 10px;
      background: rgba(0,0,0,.03);
      border: 1px solid rgba(0,0,0,.10);
    }
    .spot-btn:hover{ background: rgba(0,0,0,.06); }
    .spot-meta{
      margin-top: 10px;
      color: rgba(0,0,0,.72);
      font-size: 14px;
      line-height: 1.55;
    }
    .spot-addr{
      margin-top: 6px;
      color: rgba(0,0,0,.58);
      font-size: 12.5px;
      line-height: 1.45;
    }

    @media (max-width: 520px){
      h1{ font-size: 34px; }
      .subtitle{ font-size: 16px; }
      .intro-box{ padding: 16px 14px 14px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <a class="back-link" href="index.html">← 홈으로 돌아가기</a>

    <!-- ✅ 1) 타이틀/보조설명 강조 (옅은 핑크 배경) -->
    <section class="intro-box">
      <h1>Editor’s Picks</h1>
      <p class="subtitle">
        슈퍼소닉 스튜디오가 직접 큐레이션한 <strong>15개의</strong> 인천 음악 스팟을 확인하세요.<br>
        아래 15개의 스팟 중 맘에 드는 장소를 클릭하면 지도 링크로 연결됩니다.
      </p>
    </section>

    <!-- ✅ 2) 헤드 배너 이미지를 여기로 이동 -->
    <figure class="hero">
      <img src="editors-pick-banner.jpg" alt="Editor’s Picks 배너" loading="lazy" />
    </figure>

    <hr>

    <div class="actions">
      <a class="btn" href="https://naver.me/5xatQrem" target="_blank" rel="noopener">
        전체 15개 저장 지도 리스트 열기
      </a>
    </div>

    <nav class="zone-nav" aria-label="Zone navigation">
      <div class="zone-row">
        <a class="zone-chip" href="#bupyeong">부평</a>
        <a class="zone-chip" href="#dongincheon">동인천</a>
        <a class="zone-chip" href="#baedari">배다리</a>
        <a class="zone-chip" href="#songdo">송도</a>
        <a class="zone-chip" href="#yeongjong">영종도</a>
      </div>
    </nav>

    <!-- 이하(존/스팟 리스트)는 기존 그대로 두면 됩니다 -->
    <!-- ... 너의 15개 스팟 섹션들 ... -->

  </main>
</body>
</html>
